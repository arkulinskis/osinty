<div class="cd-doc-host">
  <article class="cd-doc" anvil:name="card">
    <div class="src"><i class="ic" anvil:dom-node="icon"></i><span anvil:dom-node="src"></span></div>
    <h3 class="cd-doc-t" anvil:dom-node="title"></h3>
    <div class="url" anvil:dom-node="url"></div>
    <anvil-component type="RepeatingPanel" name="meta_panel" prop:item_template="Osinty.Items.MetaRow" prop:role='["cd-meta"]'></anvil-component>
    <div class="body" anvil:dom-node="body"></div>
    <div class="acts"><anvil-component type="Button" name="pin_button" prop:role='["btn", "btn-sm", "ic-pushpin"]'></anvil-component></div>
  </article>
</div>
