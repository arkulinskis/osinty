<div class="kt-tool-host">
  <article class="kt-tool">
    <anvil-component type="Button" name="star_button" prop:role='["btn", "btn-ghost", "btn-icon", "ic-star", "kt-star"]'></anvil-component>
    <div class="cat" anvil:dom-node="cat"></div>
    <h3 anvil:dom-node="name"></h3>
    <p anvil:dom-node="what"></p>
    <div class="tip" anvil:dom-node="tip"></div>
    <div class="foot">
      <a class="ui-btn sm" href="#kit" target="_blank" rel="noopener" anvil:name="open_link"><i class="ic ic-external"></i>Open<span class="ui-sr" anvil:dom-node="open_sr"></span></a>
      <span class="ui-badge" anvil:dom-node="cost"></span>
    </div>
  </article>
</div>
