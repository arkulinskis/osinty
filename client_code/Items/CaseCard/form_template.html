<div class="cs-card-host">
  <article class="os-folder cs-card" anvil:dom-node="folder">
    <span class="os-stamp" anvil:dom-node="stamp"></span>
    <div class="code" anvil:dom-node="code"></div>
    <h2 anvil:dom-node="title"></h2>
    <div class="client">Client: <b anvil:dom-node="client"></b></div>
    <p anvil:dom-node="teaser"></p>
    <div class="foot">
      <a class="ui-btn primary sm" href="#cases" anvil:name="open_link"><i class="ic ic-terminal"></i><span anvil:dom-node="go"></span></a>
      <span class="ui-badge brand" anvil:dom-node="xp"></span>
      <span class="ui-badge" anvil:dom-node="minutes"></span>
      <span class="cs-srcs" anvil:dom-node="srcs"></span>
    </div>
    <p class="small muted cs-solvers" anvil:dom-node="solvers"></p>
  </article>
</div>
