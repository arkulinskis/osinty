<div class="ui ui-stack">
  <h2 class="dlg-h" anvil:dom-node="heading">Open a new file</h2>
  <p class="muted" anvil:name="intro">Write the question before you collect anything. That's step one of the intelligence cycle.</p>
  <label class="ui-field"><span>Title</span>
    <anvil-component type="TextBox" name="title_box" prop:placeholder="e.g. Background check: Acme Renovations"></anvil-component>
  </label>
  <label class="ui-field"><span>Subject <em>(who or what)</em></span>
    <anvil-component type="TextBox" name="subject_box" prop:placeholder="A person, company, website, photo..."></anvil-component>
  </label>
  <label class="ui-field"><span>The question <em>(one sentence you could answer with a fact)</em></span>
    <anvil-component type="TextArea" name="objective_box" prop:placeholder="Is Acme Renovations a registered company, and who are its directors?"></anvil-component>
  </label>
  <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
  <div class="ui-row end">
    <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
    <anvil-component type="Button" name="save_button" prop:text="Open the file" prop:role='["btn", "btn-primary", "ic-folder"]'></anvil-component>
  </div>
</div>
