<anvil-form layout="Osinty.Layouts.Shell">
  <anvil-block slot="content">
    <div class="ui-wrap ui-narrow">
      <div class="pf-head">
        <anvil-component type="Label" name="initials" prop:role='["pf-avatar"]'></anvil-component>
        <div>
          <anvil-component type="Label" name="name_title" prop:role='["pf-title"]'></anvil-component>
          <anvil-component type="Label" name="email_line" prop:role='["fine-print"]'></anvil-component>
        </div>
      </div>

      <div class="pf-dossier">
        <div class="pf-id">
          <anvil-component type="Osinty.Components.Shield" name="shield"></anvil-component>
          <div class="rk" anvil:dom-node="rank"></div>
          <div class="xp" anvil:dom-node="xp"></div>
          <div class="os-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Progress to the next rank" anvil:dom-node="bar"><i anvil:dom-node="bar_fill"></i></div>
          <div class="xp pf-duty" anvil:dom-node="duty"></div>
        </div>
        <div class="ui-card">
          <h2 class="pf-h3">Service record</h2>
          <div class="pf-record">
            <div class="pf-ladder" role="list"><anvil-component type="RepeatingPanel" name="ranks_panel" prop:item_template="Osinty.Items.RankRow"></anvil-component></div>
            <div>
              <div class="pf-stats">
                <span class="ui-stat"><b anvil:dom-node="s_lessons"></b><span>lessons passed</span></span>
                <span class="ui-stat"><b anvil:dom-node="s_perfect"></b><span>perfect quizzes</span></span>
                <span class="ui-stat"><b anvil:dom-node="s_cases"></b><span>cases closed</span></span>
                <span class="ui-stat"><b anvil:dom-node="s_best"></b><span>best case score</span></span>
                <span class="ui-stat"><b anvil:dom-node="s_invs"></b><span>investigations</span></span>
              </div>
              <div class="pf-hide">
                <anvil-component type="CheckBox" name="hide_box" prop:text="Stay in the shadows"></anvil-component>
                <span class="small muted">Hide me from the Bureau leaderboard.</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="ui-card pf-badges-card">
        <h2 class="pf-h3">Commendations</h2>
        <anvil-component type="RepeatingPanel" name="badges_panel" prop:item_template="Osinty.Items.BadgeTile" prop:role='["pf-badges"]'></anvil-component>
      </div>

      <div class="pf-grid">
        <div class="ui-card ui-stack">
          <h2 class="pf-h3">Your agent name</h2>
          <label class="ui-field"><span>Shown on the Bureau leaderboard. A codename is fine.</span>
            <anvil-component type="TextBox" name="name_box"></anvil-component>
          </label>
          <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
        </div>
        <div class="ui-card ui-stack">
          <h2 class="pf-h3">Appearance</h2>
          <p class="muted small">Follow your device, or pick one.</p>
          <div class="ui-seg" role="group" aria-label="Appearance">
            <button type="button" anvil:name="theme_auto" data-theme-pick="auto" anvil:on-dom:click="self.theme_click">Auto</button>
            <button type="button" anvil:name="theme_light" data-theme-pick="light" anvil:on-dom:click="self.theme_click">Light</button>
            <button type="button" anvil:name="theme_dark" data-theme-pick="dark" anvil:on-dom:click="self.theme_click">Dark</button>
          </div>
          <h2 class="pf-h3 pf-pw">Password</h2>
          <p class="muted small">We'll email you a link to choose a new one.</p>
          <anvil-component type="Button" name="reset_button" prop:text="Email me a reset link" prop:role='["btn", "ic-mail"]'></anvil-component>
        </div>
      </div>
      <div class="ui-card pf-more">
        <div class="pf-links">
          <a href="#admin" anvil:name="admin_link"><i class="ic ic-shield"></i>Admin</a>
          <button type="button" anvil:on-dom:click="self.feedback_click"><i class="ic ic-chat"></i>Submit feedback</button>
          <button type="button" data-lk-open="overview"><i class="ic ic-lock"></i>Privacy &amp; Terms, and your data</button>
          <button type="button" anvil:on-dom:click="self.sign_out_click"><i class="ic ic-logout"></i>Sign out</button>
        </div>
      </div>
    </div>
  </anvil-block>
</anvil-form>
